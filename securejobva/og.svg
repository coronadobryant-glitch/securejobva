<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Bricolage Grotesque, Karla, sans-serif">
  <!-- Typeset source for the share card. og.png (generated by tools/make-og.mjs)
       is the mark-only version that ships; open this file in a browser and
       export it at 1200x630 if you want the wordmark version instead.

       Colours are the four sampled off the logo file, plus the amber the site
       uses for the one thing on a page that has to be noticed. -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap");
  </style>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00214F"/>
      <stop offset="1" stop-color="#001232"/>
    </linearGradient>
    <!-- The mark inverts on the dark card: the shield lightens so it reads, and
         the plate behind the briefcase takes the card's own navy. -->
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0092FE"/>
      <stop offset="1" stop-color="#0053B4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect y="614" width="1200" height="16" fill="#0092FE"/>

  <g transform="translate(96 150) scale(3.2)">
    <path d="M16 2.5 28 7.5v9.2c0 7.1-4.9 11.7-12 13.8C8.9 28.4 4 23.8 4 16.7V7.5L16 2.5Z" fill="url(#mark)"/>
    <path d="M16 5.2 25.7 9.2v7.2c0 5.8-4 9.6-9.7 11.3-5.7-1.7-9.7-5.5-9.7-11.3V9.2L16 5.2Z" fill="#001232"/>
    <path d="M13.2 13.1v-1.4a1.7 1.7 0 0 1 1.7-1.7h2.2a1.7 1.7 0 0 1 1.7 1.7v1.4" stroke="url(#mark)" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <rect x="8.9" y="13.1" width="14.2" height="9.6" rx="1.7" fill="url(#mark)"/>
    <path d="m11.9 18.2 2.9 3 6.1-7" stroke="#001232" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="232" y="212" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="-1.2">SecureJob<tspan fill="#0092FE">VA</tspan></text>
  <text x="232" y="292" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="-2.6">Cover the hours</text>
  <text x="232" y="368" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="-2.6">you can&#8217;t.</text>
  <rect x="232" y="384" width="286" height="10" fill="#FFC233"/>

  <text x="232" y="462" fill="#C7DCF6" font-size="29" font-family="Karla, sans-serif">Dedicated virtual assistants &#183; $9/hr flat &#183; placed in about a week</text>
  <text x="232" y="530" fill="#0092FE" font-size="20" font-family="IBM Plex Mono, monospace" letter-spacing="2.4">SECUREJOBVA.COM</text>
</svg>
