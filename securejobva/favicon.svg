<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The full mark: shield ring, briefcase, check. Same geometry as the inline
       marks in the pages, with the colours written out — a favicon is fetched on
       its own, so it cannot read the site's tokens.

       Browsers render this against their own tab strip, which follows the OS
       theme rather than the site's toggle, so the palette flips on
       prefers-color-scheme. Chrome ignores the query today and takes the light
       set; that is the right way round, since it is the one that also holds up
       on a white bookmarks bar. -->
  <style>
    .shield-from { stop-color: #0072EE }
    .shield-to   { stop-color: #002E6B }
    .plate       { fill:  #FFFFFF }
    .check       { stroke: #FFFFFF }
    @media (prefers-color-scheme: dark) {
      .shield-from { stop-color: #6FBBFF }
      .shield-to   { stop-color: #2B7FE0 }
      .plate       { fill:  #0B1424 }
      .check       { stroke: #08111F }
    }
  </style>

  <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" class="shield-from"/>
    <stop offset="1" class="shield-to"/>
  </linearGradient>

  <path d="M16 2.5 28 7.5v9.2c0 7.1-4.9 11.7-12 13.8C8.9 28.4 4 23.8 4 16.7V7.5L16 2.5Z" fill="url(#s)"/>
  <path d="M16 5.2 25.7 9.2v7.2c0 5.8-4 9.6-9.7 11.3-5.7-1.7-9.7-5.5-9.7-11.3V9.2L16 5.2Z" class="plate"/>
  <path d="M13.2 13.1v-1.4a1.7 1.7 0 0 1 1.7-1.7h2.2a1.7 1.7 0 0 1 1.7 1.7v1.4" stroke="url(#s)" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <rect x="8.9" y="13.1" width="14.2" height="9.6" rx="1.7" fill="url(#s)"/>
  <path d="m11.9 18.2 2.9 3 6.1-7" class="check" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
